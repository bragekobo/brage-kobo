<!-- ============================================================
     SNS・LINE に URL を はったときの プレビュー（OGP / Twitter Card）
     ------------------------------------------------------------
     ⚠️【公開するときに かならず 直す 3か所】⚠️
       og:url ／ og:image ／ twitter:image は、いま「相対パス」で 書いてある。
       SNS の よみとり係（クローラー）は 相対パスを 読めないので、
       公開先の ドメインが きまったら https:// から はじまる 絶対URL に 書きかえること。
         og:url        → https://<公開先>/games/
         og:image      → https://<公開先>/games/cards/%E3%83%8F%E3%83%BC%E3%83%88A.png
         twitter:image → og:image と おなじ
       ※ 画像の ファイル名は 日本語なので URL エンコード ずみ（= ハートA.png）。
       ※ いまの og:image は トランプ1枚（419×635・たてなが）。
          twitter:card は たてながが つぶれない summary に している。
          将来 1200×630 の よこながの 絵（ハッピー）を つくったら さしかえる。
     ============================================================ -->

<meta property="og:site_name" content="ブラゲ工房">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="ブラゲ工房 ― ブラウザを開けば、そこが遊び場！">

<meta property="og:url" content="https://bragekobo.com/"><!-- ✅ 公開先URLに設定ずみ -->

    <!-- ▼ コネクトフォー ―― 青い 盤を 2列×3段 だけ 切り取った 絵。
         社長の 写真の 2×2（空・赤 ／ 赤・黄）を 上2段に そのまま 置き、
         その 下に もう1段 足して 2:3（＝絵札と同じ 比率）に している。
           左の列（下から）：黄色・赤・空
           右の列（下から）：赤・黄色・赤
         赤3・黄2・空1。コマは 下から つみ上がる 遊びなので、
         空は かならず 一番上 ―― 本当の 手番の 順でも 起こる ならびに してある。 -->
    <symbol id="art-connect4" viewBox="0 0 210 318">
      <rect width="210" height="318" fill="#3F9BE0"/>
      <rect width="210" height="318" fill="none" stroke="#2C7CBC" stroke-width="10"/>

        <circle cx="157.5" cy="53"  r="39" fill="#EF4E4E" stroke="#C22C2C"/>

        <circle cx="157.5" cy="265" r="39" fill="#EF4E4E" stroke="#C22C2C"/>
      </g>
      <!-- つや（コマが まるいと わかる ひかり）。空の あなには 付けない -->
      <g fill="#fff" opacity=".3">
        <ellipse cx="146" cy="41"  rx="10" ry="7" transform="rotate(-35 146 41)"/>
        <ellipse cx="41"  cy="147" rx="10" ry="7" transform="rotate(-35 41 147)"/>

      </g>
    </symbol>

    <!-- ▼ 五目並べ ―― 碁ばんを 切り取った 絵。線は はしまで のびていて、
         「大きい 盤の 一部を 見ている」ことが わかる。
         石は かならず 線の 交わる 所に 置く（マスの 中では ない）。
         白1つの 下に 黒2つ（社長の 写真の ならび）。3つの まん中が 絵の まん中。 -->
    <symbol id="art-goban" viewBox="0 0 210 318">
      <rect width="210" height="318" fill="#EDC489"/>
      <g stroke="#A9743C" stroke-width="3.8" stroke-linecap="square">

      <circle cx="70" cy="124" r="30" fill="#FFFFFF" stroke="#7B5C33" stroke-width="3.2"/>
      <!-- 黒い石（2つ）。つやは 付けない ―― 小さくすると 目のように 見えてしまう -->
      <g fill="#2F2B29">
        <circle cx="70"  cy="194" r="30"/>
        <circle cx="140" cy="194" r="30"/>
      </g>
    </symbol>

/* ハッピー（看板ねこ）の ふきだし。じゅんばんに かわる。
   ふきだしは よこに のびない やくそくなので、1つ 7もじ までに おさえる。 */
const CAT_WORDS = ['ハッピーだよ！', '遊ぼうよ！', 'どれにする？', '待ってたよ！', '楽しいよ〜！'];

/* 絵札のURL（日本語ファイル名なので必ずエンコードする） */
function cardSrc(name) {
  return 'cards/' + encodeURIComponent(name) + '.png';
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

/* ---- ヒーローの扇（飾り。3枚だけ） ---- */
['ハートA', 'スペードA', 'クローバーA'].forEach(function (name) {
  const img = new Image();
  img.src = cardSrc(name);
  img.alt = '';
  img.width = 419;
  img.height = 635;
  img.decoding = 'async';
  document.getElementById('fan').appendChild(img);
});

/* ---- 遊べるゲーム ---- */
const grid = document.getElementById('gameGrid');

GAMES.forEach(function (g) {
  const a = el('a', 'game');
  a.href = g.path;
  a.setAttribute('aria-label', g.title + 'で遊ぶ');

  const art = el('span', 'game-art');
  if (g.card) {
    const img = new Image();
    img.src = cardSrc(g.card);
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    art.appendChild(img);
  } else if (g.art) {
    /* トランプを 使わない ゲームの 絵（上の <defs> に かいてある）。
       viewBox が わくと 同じ 比率なので slice でも 切れない（0.1%未満）。 */
    art.innerHTML =
      '<svg viewBox="0 0 210 318" width="100%" height="100%" style="display:block"' +
      ' preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' +
      '<use href="#' + g.art + '"/></svg>';
  } else {
    art.textContent = g.emoji || '🎮';
  }

  const body = el('span', 'game-body');
  /* 絵を出しているときは、タイトル横の絵文字は付けない（要素を減らして締める） */
  if (g.titleParts && g.titleParts.join('') === g.title) {
    /* ★ 長い 題は ★決めた 切れ目でだけ 折る（★塊は 折れない）。★字は title と 同じ */
    const tt = el('span', 'game-title', '');
    g.titleParts.forEach(function (p) { const q = el('span', '', p); q.style.display = 'inline-block'; q.style.whiteSpace = 'nowrap'; tt.appendChild(q); });
    body.appendChild(tt);
  } else body.appendChild(el('span', 'game-title', (!g.card && !g.art && g.emoji ? g.emoji + ' ' : '') + g.title));
  body.appendChild(el('span', 'game-desc', g.desc));

  const meta = el('span', 'game-meta');
  if (g.time) meta.appendChild(el('span', 'tag time', '⏱ ' + g.time));
  (g.tags || []).forEach(function (t) { meta.appendChild(el('span', 'tag', t)); });
  body.appendChild(meta);

  a.appendChild(art);
  a.appendChild(body);
  a.appendChild(el('span', 'game-go', '遊ぶ ▶'));
  grid.appendChild(a);
});

/* ---- もうすぐ あそべるよ ---- */
const soonGrid = document.getElementById('soonGrid');

COMING.forEach(function (c) {
  const box = el('div', 'soon');
  box.appendChild(el('div', 'soon-art', c.emoji || '？'));

  const body = el('div', 'soon-body');
  body.appendChild(el('p', 'soon-title', c.title));
  if (c.desc) body.appendChild(el('p', 'soon-desc', c.desc));
  body.appendChild(el('span', 'soon-badge', '準備中'));

  box.appendChild(body);
  soonGrid.appendChild(box);
});

/* ---- 「今、遊べるよ！」の 横の 本数 ----
   （目標の メーター・「残り ○本」・「あと ○本」は 2026-09-11 に 消した） */

const bubble = document.getElementById('bubble');
const calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

if (bubble && !calm) {
  let i = 0;
  setInterval(function () {
    i = (i + 1) % CAT_WORDS.length;
    bubble.textContent = CAT_WORDS[i];
  }, 3800);
}
